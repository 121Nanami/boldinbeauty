; Angel AI difficulty knobs (owner request 2026-10-13, goal 2 - BIBRules/BIBAngelBrain.h; the Unreal layer reads them at start and on
; the console command BIBAngelReload). <Tier>.<Knob> per tier (Regular: angel, heavy, ranged, mage, assassin; Elite: mini boss;
; Boss: chapter boss) are base values; Difficulty divides reaction time / attack interval and multiplies the chances (owner:
; "make the angels overall a bit harder"), ReactionPerChapter makes later chapters react faster, never under ReactionFloor.
