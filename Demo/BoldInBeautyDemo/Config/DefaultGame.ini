[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Boldinbeauty Demo
Description=Gameplay and UI demo with placeholder shapes.

[/Script/UnrealEd.ProjectPackagingSettings]
; Runtime-loaded assets (e.g. M_BIBTint) are cooked with the rest of /Game/BIB.
+DirectoriesToAlwaysCook=(Path="/Game/BIB")
+DirectoriesToAlwaysCook=(Path="/Game/Greybox/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Weather")
; Brand fonts for the Slate HUD (League Gothic, JetBrains Mono, Archivo Black; OFL), loaded from files at runtime.
+DirectoriesToAlwaysStageAsUFS=(Path="BIBFonts")
; Motion pack (2026-10-09): the atlas manifest, and the videos the media player and the startup movie read as plain files.
+DirectoriesToAlwaysStageAsUFS=(Path="BIBMotion")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")
+DirectoriesToAlwaysCook=(Path="/Game/BIBMotion")

; Gameplay cue notifies (none authored yet): limits the cue manager scan so it does not search all of /Game/ (the engine warns otherwise).
[/Script/GameplayAbilities.GameplayAbilitiesDeveloperSettings]
+GameplayCueNotifyPaths=/Game/BIB/GameplayCues

[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/BIB/GameplayCues

; Account service (Demo/BoldInBeautyDemo/Server). Point this at the deployed server; use https:// for anything but local testing.
; A launch argument overrides it:  -BIBApi=https://accounts.example.com
[BoldInBeauty]
ApiBaseUrl="http://127.0.0.1:8080"

; The download trailer of the bb-Showreel pack plays while the game starts (skippable; packaged builds only).
[/Script/MoviePlayer.MoviePlayerSettings]
bWaitForMoviesToComplete=False
bMoviesAreSkippable=True
+StartupMovies=BB_Download_Trailer

; Combat feel (owner request 2026-10-13: every player attack should feel physical). Read by BIBRules/BIBHitFeel.h through
; BIBGame/BIBFeelConfig.cpp at start; console command BIBFeelReload re-reads this file while playing. Defaults must match the
; code (Tests/feel_tests.cpp checks every key). Weights: Tick, Light, Medium, Heavy, Finisher, Ultimate, UltimateFinisher.
; HitstopFrames = frames at FrameRate that the attacker AND the target freeze. Vs* = the reaction on light enemies (grunt,
; ranged, mage, assassin), medium (brute) and heavy (mini boss, boss): None, Recoil, Flinch, Stagger, Knockback, Launch,
; Knockdown. All numbers PROPOSED.
; Sound.<Weight> = comma-separated sound asset paths layered on a hit of that weight (empty: no sound yet - the project has no
